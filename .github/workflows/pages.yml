name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only the prototype, so it lands at the site root
      # and the hardware/tasks notes are not deployed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-prototype

      - id: deployment
        uses: actions/deploy-pages@v4
