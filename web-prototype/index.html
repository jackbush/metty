<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Metty — interface prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="deck">

  <!-- ── Bowl ─────────────────────────────────────────────── -->
  <div id="bowl-zone">
    <div id="bowl">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div id="bowl-centre"></div>
    </div>
  </div>

  <!-- ── Striker ──────────────────────────────────────────── -->
  <div id="striker">
    <div id="striker-pivot"></div>
    <div id="striker-arm">
      <div id="striker-head"></div>
    </div>
  </div>

  <!-- ── Controls ─────────────────────────────────────────── -->
  <div id="controls">

    <!-- Program: 4-position selector -->
    <div class="group" id="group-program">
      <div class="prog-wrap">
        <div class="dial prog-dial" id="dial-program" tabindex="0" role="slider"
             aria-label="Program" aria-valuetext="Off">
          <div class="dial-face"></div>
          <div class="ticks"></div>
          <div class="dial-pointer"></div>
        </div>
        <span class="prog-label pos-nw" data-program="off">OFF</span>
        <span class="prog-label pos-ne" data-program="metta">METTA</span>
        <span class="prog-label pos-se" data-program="bodyscan">BODY</span>
        <span class="prog-label pos-sw" data-program="custom">CUSTOM</span>
      </div>
    </div>

    <!-- Time + Repeats. Labels sit between the two dials: the dial
         each one names is directly above / below it. -->
    <div class="group" id="group-stack">
      <div class="stack">
        <div class="dial small-dial" id="dial-duration" tabindex="0" role="slider"
             aria-label="Segment duration">
          <div class="dial-face"></div>
          <div class="ticks"></div>
          <div class="dial-pointer"></div>
        </div>
        <span class="mini-name">DURATION</span>
        <span class="mini-name">REPEATS</span>
        <div class="dial small-dial" id="dial-reps" tabindex="0" role="slider"
             aria-label="Repeats">
          <div class="dial-face"></div>
          <div class="ticks"></div>
          <div class="dial-pointer"></div>
        </div>
      </div>
    </div>

    <!-- Screen: top row 30% (repeats remaining + total), bottom row 60% (segment) -->
    <div class="group" id="group-screen">
      <div id="screen">
        <div class="scr-top" id="scr-top">
          <div class="seg-box" id="d-reps"></div>
          <div class="seg-box" id="d-total"></div>
        </div>
        <div class="scr-bottom">
          <div class="seg-box" id="d-segment"></div>
        </div>
      </div>
    </div>

    <!-- Play -->
    <div class="group" id="group-play">
      <div class="stack">
        <button class="btn" id="play" aria-label="Start or stop session">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon id="glyph-play" points="34,24 34,76 78,50"></polygon>
            <g id="glyph-stop" hidden>
              <rect x="32" y="30" width="14" height="40"></rect>
              <rect x="54" y="30" width="14" height="40"></rect>
            </g>
          </svg>
        </button>
        <span class="mini-name">PLAY</span>
        <span class="mini-name">RESET</span>
        <button class="btn" id="reset" aria-label="Reset to program preset">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect x="28" y="28" width="8" height="44"></rect>
            <polygon points="72,28 72,72 42,50"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
