<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Metty — interface prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="deck">

  <!-- ── Bowl ─────────────────────────────────────────────── -->
  <div id="bowl-zone">
    <div id="bowl">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div id="bowl-centre"></div>
    </div>
  </div>

  <!-- ── Striker ──────────────────────────────────────────── -->
  <div id="striker">
    <div id="striker-pivot"></div>
    <div id="striker-arm">
      <div id="striker-head"></div>
    </div>
  </div>

  <!-- ── Controls ─────────────────────────────────────────── -->
  <div id="controls">

    <!-- Program: 4-position selector -->
    <div class="group" id="group-program">
      <div class="prog-wrap">
        <div class="dial prog-dial" id="dial-program" tabindex="0" role="slider"
             aria-label="Program" aria-valuetext="Off">
          <div class="dial-face"></div>
          <div class="ticks"></div>
          <div class="dial-pointer"></div>
        </div>
        <span class="prog-name">PROGRAM</span>
        <span class="prog-label pos-nw" data-program="off" aria-label="Off">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true">
            <line x1="128" y1="48" x2="128" y2="124"></line>
            <path d="M176,54.2A88,88,0,1,1,80,54.2"></path>
          </svg>
        </span>
        <span class="prog-label pos-ne" data-program="metta" aria-label="Metta">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true">
            <circle cx="128" cy="128" r="96"></circle>
            <line x1="128" y1="32" x2="128" y2="224"></line>
            <line x1="128" y1="128" x2="60" y2="196"></line>
            <line x1="128" y1="128" x2="196" y2="196"></line>
          </svg>
        </span>
        <span class="prog-label pos-se" data-program="bodyscan" aria-label="Body scan">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true">
            <circle cx="128" cy="52" r="26"></circle>
            <path d="M72,152,128,104l56,48"></path>
            <path d="M128,104v56"></path>
            <path d="M94,224l34,-64l34,64"></path>
          </svg>
        </span>
        <span class="prog-label pos-sw" data-program="custom" aria-label="Custom">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true">
            <circle cx="128" cy="144" r="80"></circle>
            <line x1="104" y1="24" x2="152" y2="24"></line>
            <line x1="128" y1="24" x2="128" y2="64"></line>
            <line x1="128" y1="144" x2="160" y2="112"></line>
          </svg>
        </span>
      </div>
    </div>

    <!-- Repeats + Length. Each label is centred directly above the
         dial it names; length is the bigger of the two. -->
    <div class="group" id="group-stack">
      <div class="stack">
        <span class="mini-name">REPEATS</span>
        <div class="dial reps-dial" id="dial-reps" tabindex="0" role="slider"
             aria-label="Repeats">
          <div class="dial-face"></div>
          <div class="ticks"></div>
          <div class="dial-pointer"></div>
        </div>
        <span class="mini-name">LENGTH</span>
        <div class="dial length-dial" id="dial-duration" tabindex="0" role="slider"
             aria-label="Segment length">
          <div class="dial-face"></div>
          <div class="ticks"></div>
          <div class="dial-pointer"></div>
        </div>
      </div>
    </div>

    <!-- Screen: top row 30% (repeats remaining + total), bottom row 60% (segment) -->
    <div class="group" id="group-screen">
      <div id="screen">
        <div class="scr-top" id="scr-top">
          <div class="seg-box" id="d-reps"></div>
          <div class="seg-box" id="d-total"></div>
        </div>
        <div class="scr-bottom">
          <div class="seg-box" id="d-segment"></div>
        </div>
      </div>
    </div>

    <!-- Play -->
    <div class="group" id="group-play">
      <div class="stack stack-play">
        <button class="btn" id="play" aria-label="Start or stop session">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon id="glyph-play" points="34,24 34,76 78,50"></polygon>
            <g id="glyph-stop" hidden>
              <rect x="32" y="30" width="14" height="40"></rect>
              <rect x="54" y="30" width="14" height="40"></rect>
            </g>
          </svg>
        </button>
      </div>
    </div>

  </div>
</main>

<script src="app.js"></script>
</body>
</html>
